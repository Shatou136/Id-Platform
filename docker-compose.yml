services:
  postgres:
    image: postgres:16
    container_name: school-id-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: school_id_db
    ports:
      - "5432:5432"
    volumes:
      - school_id_postgres_data:/var/lib/postgresql/data

volumes:
  school_id_postgres_data: